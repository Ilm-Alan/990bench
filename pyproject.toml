[project]
name = "bench990"
version = "0.1.0"
description = "Agent benchmark and reliability study over IRS Form 990 filings, with code-computed, independently verified ground truth"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alan", email = "105959075+Ilm-Alan@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "inflate64>=1.0.4",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pypdfium2>=5.14.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
